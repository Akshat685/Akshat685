<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230">
<defs><linearGradient id="cBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0533"/><stop offset="100%" stop-color="#0d0221"/></linearGradient>
  <linearGradient id="rG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#c026d3"/></linearGradient>
  <linearGradient id="bdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#c026d3"/></linearGradient>
  <linearGradient id="hS" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="rgba(255,255,255,0)"/><stop offset="45%" stop-color="rgba(255,255,255,0)"/><stop offset="50%" stop-color="rgba(255,255,255,0.4)"/><stop offset="55%" stop-color="rgba(255,255,255,0)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></linearGradient>
  <clipPath id="cC"><rect width="500" height="230" rx="12"/></clipPath></defs>
<rect width="500" height="230" rx="12" fill="url(#cBg)" stroke="url(#bdr)" stroke-width="1.5" stroke-opacity="0.3"/>
<text x="22" y="30" font-size="14" fill="#f472b6" font-family="Segoe UI,sans-serif" font-weight="bold">&#11088; Akshat Shettigar's GitHub Stats</text>
<line x1="22" y1="40" x2="280" y2="40" stroke="#4c1d95" stroke-width="1"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/><text x="22" y="58" font-size="12" fill="#e2e8f0" font-family="Segoe UI,sans-serif">&#11088; Total Stars Earned:</text><text x="280" y="58" font-size="13" fill="#fbbf24" font-weight="bold" font-family="Segoe UI,sans-serif" text-anchor="end">0+</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/><text x="22" y="86" font-size="12" fill="#e2e8f0" font-family="Segoe UI,sans-serif">&#128221; Total Commits:</text><text x="280" y="86" font-size="13" fill="#4ade80" font-weight="bold" font-family="Segoe UI,sans-serif" text-anchor="end">245+</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/><text x="22" y="114" font-size="12" fill="#e2e8f0" font-family="Segoe UI,sans-serif">&#128193; Public Repos:</text><text x="280" y="114" font-size="13" fill="#60a5fa" font-weight="bold" font-family="Segoe UI,sans-serif" text-anchor="end">20+</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/><text x="22" y="142" font-size="12" fill="#e2e8f0" font-family="Segoe UI,sans-serif">&#128101; Followers:</text><text x="280" y="142" font-size="13" fill="#f472b6" font-weight="bold" font-family="Segoe UI,sans-serif" text-anchor="end">0+</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/><text x="22" y="170" font-size="12" fill="#e2e8f0" font-family="Segoe UI,sans-serif">&#128296; Projects Built:</text><text x="280" y="170" font-size="13" fill="#a78bfa" font-weight="bold" font-family="Segoe UI,sans-serif" text-anchor="end">19</text></g>

<circle cx="410" cy="130" r="50" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="7"/>
<circle cx="410" cy="130" r="50" fill="none" stroke="url(#rG)" stroke-width="7"
        stroke-dasharray="314" stroke-dashoffset="314" stroke-linecap="round" transform="rotate(-90 410 130)">
  <animate attributeName="stroke-dashoffset" from="314" to="95" dur="2s" begin="0.5s" fill="freeze"/></circle>
<text x="410" y="125" text-anchor="middle" font-size="24" fill="#c084fc" font-family="Segoe UI,sans-serif" font-weight="bold" opacity="0">B+<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/></text>
<text x="410" y="145" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="Segoe UI,sans-serif" opacity="0">RANK<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/></text>
<rect x="-500" y="0" width="500" height="230" fill="url(#hS)" clip-path="url(#cC)" opacity="0.5">
  <animate attributeName="x" from="-500" to="500" dur="3s" begin="2s" repeatCount="indefinite"/></rect>
</svg>